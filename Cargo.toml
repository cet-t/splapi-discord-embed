[package]
name = "splapi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
port_check = "0.3"
reqwest = "0.13.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
